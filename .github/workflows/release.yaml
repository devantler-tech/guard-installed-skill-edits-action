name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Preview release recovery without publishing
        type: boolean
        default: false
permissions: {}
jobs:
  release:
    uses: devantler-tech/.github/.github/workflows/create-release.yaml@f558e3ababb474ac0e6f27d988ce8c876a525196 # v13.4.0
    with:
      dry-run: ${{ inputs.dry-run || false }}
      disable-issue-side-effects: true
      warn-missing-breaking-bang: true
      protected-release: true
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
