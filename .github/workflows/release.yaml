name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Preview release recovery without publishing
        type: boolean
        default: false
permissions: {}
jobs:
  release:
    uses: devantler-tech/.github/.github/workflows/create-release.yaml@711337ea623e44536204b40fff5278166aa64ffa # v21.12.3
    with:
      dry-run: ${{ inputs.dry-run || false }}
      disable-issue-side-effects: true
      warn-missing-breaking-bang: true
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
