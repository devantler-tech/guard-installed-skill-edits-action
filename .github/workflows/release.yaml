name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions: {}
jobs:
  release:
    uses: devantler-tech/.github/.github/workflows/create-release.yaml@c6ac1058d20508cba27d696230481396b2e9a08b # v13.3.1
    with:
      disable-issue-side-effects: true
      warn-missing-breaking-bang: true
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
